<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnifying Glass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <section class="hero">
        <p class="eyebrow">Magnify</p>
        <h1>Sharper focus for any page</h1>
        <p class="subtitle">Toggle the lens on the current tab, then tune the zoom and lens size live.</p>
      </section>

      <button id="toggleButton" class="toggle-button" type="button">Toggle on this tab</button>

      <section class="control-card">
        <label class="control" for="zoomRange">
          <span>Zoom</span>
          <strong id="zoomValue">2.00x</strong>
        </label>
        <input id="zoomRange" type="range" min="1.25" max="4" step="0.25" />
      </section>

      <section class="control-card">
        <label class="control" for="sizeRange">
          <span>Lens size</span>
          <strong id="sizeValue">180px</strong>
        </label>
        <input id="sizeRange" type="range" min="120" max="280" step="10" />
      </section>

      <p class="hint">Press Esc on the page to close the lens.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
