<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunny Converter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <span class="logo">🐰</span>
    <h1>Bunny Converter</h1>
  </header>

  <section class="panel active">
    <label for="conv-category">Category</label>
    <select id="conv-category"></select>

    <label for="conv-value">Value</label>
    <input id="conv-value" type="number" inputmode="decimal" />

    <label for="conv-from">From</label>
    <select id="conv-from"></select>

    <label for="conv-to">To</label>
    <select id="conv-to"></select>

    <button id="conv-btn" class="primary-btn">Convert</button>

    <output id="conv-result" class="result" aria-live="polite"></output>
  </section>

  <script src="popup.js"></script>
</body>
</html>
