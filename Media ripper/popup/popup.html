<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading zone text</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="run">Run</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <!-- Run Tab -->
    <section id="run-tab" class="tab-content active">
      <h1>Reading zone text</h1>
      <p class="subtitle">Extract text from the current page and open it in the reader.</p>
      <button id="run-btn" type="button">Run Extension</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <!-- Settings Tab -->
    <section id="settings-tab" class="tab-content">
      <h1>Settings</h1>
      
      <div class="setting-group">
        <label for="format-select">File Format:</label>
        <select id="format-select">
          <option value="txt">Text (.txt)</option>
          <option value="md">Markdown (.md)</option>
          <option value="json">JSON (.json)</option>
          <option value="csv">CSV (.csv)</option>
          <option value="html">HTML (.html)</option>
        </select>
      </div>

      <button id="save-settings-btn" class="save-btn">Save Settings</button>
      <p id="settings-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>

</html>
