<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bunny Mathbox</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Bunny Mathbox</h1>
      <p>Calculator and converter tools all in one place.</p>
    </header>

    <section class="tool-picker">
      <label for="tool-select">Choose tool</label>
      <select id="tool-select">
        <option value="calculator">Standard Calculator</option>
        <option value="converter">Unit Converter</option>
          <option value="ratio">Ratio Calculator</option>
        <option value="ohms">Quick Ohms Law Tool</option>
        <option value="voltage">Voltage Calculator</option>
        <option value="resistor">Resistor Calculator</option>
        <option value="battery">Battery Calculator</option>
      </select>
    </section>

    <section id="tool-calculator" class="tool-section is-active" data-tool="calculator">
      <output id="calc-display" class="calc-display">0</output>
      <div class="calc-grid" id="calc-grid">
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-op="/">/</button>

        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-op="*">*</button>

        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-op="-">-</button>

        <button type="button" data-key="0">0</button>
        <button type="button" data-key=".">.</button>
        <button type="button" id="calc-clear">C</button>
        <button type="button" data-op="+">+</button>

        <button type="button" id="calc-equals" class="wide">=</button>
      </div>
    </section>

    <section id="tool-converter" class="tool-section" data-tool="converter">
      <label for="conv-category">Category</label>
      <select id="conv-category"></select>

      <label for="conv-value">Value</label>
      <input id="conv-value" type="number" inputmode="decimal" />

      <label for="conv-from">From</label>
      <select id="conv-from"></select>

      <label for="conv-to">To</label>
      <select id="conv-to"></select>

      <button type="button" id="conv-run">Convert</button>
      <output id="conv-result" class="result" aria-live="polite"></output>
    </section>

    <section id="tool-ratio" class="tool-section" data-tool="ratio">
      <label for="ratio-left">First ratio value</label>
      <input id="ratio-left" type="number" step="any" placeholder="e.g. 16" />

      <label for="ratio-right">Second ratio value</label>
      <input id="ratio-right" type="number" step="any" placeholder="e.g. 9" />

      <label for="ratio-known-left">If first value becomes</label>
      <input id="ratio-known-left" type="number" step="any" placeholder="e.g. 32" />

      <label for="ratio-known-right">If second value becomes</label>
      <input id="ratio-known-right" type="number" step="any" placeholder="e.g. 27" />

      <div class="row-actions">
        <button type="button" id="ratio-calc">Calculate</button>
        <button type="button" id="ratio-clear" class="secondary">Clear</button>
      </div>

      <output id="ratio-result" class="result" aria-live="polite"></output>
    </section>

    <section id="tool-ohms" class="tool-section" data-tool="ohms">
      <label for="ohm-voltage">Voltage (V)</label>
      <input id="ohm-voltage" type="number" step="any" placeholder="e.g. 12" />

      <label for="ohm-current">Current (I)</label>
      <input id="ohm-current" type="number" step="any" placeholder="e.g. 1.5" />

      <label for="ohm-resistance">Resistance (R)</label>
      <input id="ohm-resistance" type="number" step="any" placeholder="e.g. 8" />

      <label for="ohm-power">Power (P)</label>
      <input id="ohm-power" type="number" step="any" placeholder="e.g. 18" />

      <div class="row-actions">
        <button type="button" id="ohm-calc">Calculate</button>
        <button type="button" id="ohm-clear" class="secondary">Clear</button>
      </div>
      <output id="ohm-result" class="result" aria-live="polite"></output>
    </section>

    <section id="tool-voltage" class="tool-section" data-tool="voltage">
      <label for="volt-current">Current (I in A)</label>
      <input id="volt-current" type="number" step="any" placeholder="e.g. 2" />

      <label for="volt-resistance">Resistance (R in ohm)</label>
      <input id="volt-resistance" type="number" step="any" placeholder="e.g. 5" />

      <label for="volt-power">Power (P in W)</label>
      <input id="volt-power" type="number" step="any" placeholder="e.g. 20" />

      <div class="row-actions">
        <button type="button" id="volt-calc">Calculate Voltage</button>
        <button type="button" id="volt-clear" class="secondary">Clear</button>
      </div>

      <output id="volt-result" class="result" aria-live="polite"></output>
    </section>

    <section id="tool-resistor" class="tool-section" data-tool="resistor">
      <label for="res-vin">Supply Voltage (V_in)</label>
      <input id="res-vin" type="number" step="0.01" min="0" value="5" />

      <label for="res-vout">Target Voltage (V_target)</label>
      <input id="res-vout" type="number" step="0.01" min="0" value="3.7" />

      <label for="res-current">Load Current (mA)</label>
      <input id="res-current" type="number" step="0.1" min="0" value="200" />

      <button type="button" id="res-calc">Calculate</button>

      <div id="res-result" class="result-block hidden" aria-live="polite">
        <p id="res-r-line"></p>
        <p id="res-p-line"></p>
        <p id="res-note-line" class="muted"></p>
      </div>
    </section>

    <section id="tool-battery" class="tool-section" data-tool="battery">
      <label for="bat-voltage">Single Battery Voltage (V)</label>
      <input id="bat-voltage" type="number" step="any" min="0" placeholder="e.g. 3.7" />

      <label for="bat-current">Single Battery Current (A)</label>
      <input id="bat-current" type="number" step="any" min="0" placeholder="e.g. 2" />

      <label for="bat-count">Number of Batteries</label>
      <input id="bat-count" type="number" step="1" min="1" placeholder="e.g. 4" />

      <div class="row-actions">
        <button type="button" id="bat-calc">Calculate</button>
        <button type="button" id="bat-clear" class="secondary">Clear</button>
      </div>

      <div id="bat-result" class="result-block hidden" aria-live="polite">
        <p id="bat-series-line"></p>
        <p id="bat-parallel-line"></p>
        <p id="bat-note-line" class="muted"></p>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
