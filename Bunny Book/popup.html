<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunny Book</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Bunny Book</h1>
    <span id="saveStatus" class="status" aria-live="polite"></span>
  </div>

  <div class="topbarActions">
    <button id="newNote" class="btn btnPrimary" title="New note" type="button">New</button>
  </div>
</header>

<div id="listView" class="view">
  <div class="listTools">
    <label class="srOnly" for="searchInput">Search notes</label>
    <input id="searchInput" class="search" placeholder="Search notes..." autocomplete="off">
  </div>

  <div id="emptyState" class="empty hidden">
    <div class="emptyTitle">No notes yet</div>
    <div class="emptyText">Create your first note to get started.</div>
    <button id="newNoteEmpty" class="btn btnPrimary" type="button">Create a note</button>
  </div>

  <ul id="noteList" class="noteList" role="list"></ul>
</div>

<div id="editorView" class="view hidden">
  <div class="editorHeader">
    <input id="titleInput" class="title" placeholder="Title" maxlength="80" aria-label="Note title">
    <button id="backToList" class="btn btnGhost" type="button" title="Back to list">Back</button>
  </div>

  <textarea id="bodyInput" class="body" placeholder="Write here..." aria-label="Note body"></textarea>

  <div class="editorButtons">
    <button id="saveNote" class="btn btnPrimary" type="button">Save</button>
    <button id="exportNote" class="btn" type="button">Export</button>
    <button id="deleteNote" class="btn btnDanger" type="button">Delete</button>
    <button id="micBtn" class="btn" type="button" title="Voice to text" aria-label="Voice to text">Mic</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
