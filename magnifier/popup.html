<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magnifier Glass</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-width: 220px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0;
      gap: 8px;
    }
    label {
      font-size: 12px;
      color: #9ca3af;
    }
    input[type="range"] {
      width: 130px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.off {
      background: #4b5563;
      color: #e5e7eb;
    }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>Magnifier Glass</h1>

  <div class="row">
    <label for="zoomRange">Zoom (<span id="zoomValue">2.0×</span>)</label>
    <input id="zoomRange" type="range" min="1.2" max="4" step="0.1" />
  </div>

  <div class="row">
    <label for="sizeRange">Size (<span id="sizeValue">220px</span>)</label>
    <input id="sizeRange" type="range" min="120" max="400" step="10" />
  </div>

  <button id="toggleBtn">Toggle magnifier</button>

  <div class="hint">
    Shortcut: <strong>Ctrl + Shift + M</strong>
  </div>

  <script src="popup.js"></script>
</body>
</html>
