<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Resistor Calculator</title>
</head>
<body>
  <div class="card">
    <h1>Resistor Calculator</h1>

    <label for="vin">Supply Voltage (V_in)</label>
    <input id="vin" name="vin" type="number" step="0.01" min="0" value="5" />

    <label for="vout">Target Voltage (V_target)</label>
    <input id="vout" name="vout" type="number" step="0.01" min="0" value="3.7" />

    <label for="current">Load Current (mA)</label>
    <input id="current" name="current" type="number" step="0.1" min="0" value="200" />

    <!-- BUGFIX: default button type is "submit"; make it explicit to avoid unintended form submission/reload -->
    <button id="calc" type="button">Calculate</button>

    <div id="result" class="result hidden">
      <div id="rLine"></div>
      <div id="pLine"></div>
      <div id="noteLine" class="muted"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
