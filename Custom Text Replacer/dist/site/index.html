<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini Text Blaze Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mini Text Blaze Editor</h1>
    <p>Open this page while the extension is installed. Click <strong>Load</strong> to fetch snippets from the extension, edit, then click <strong>Save</strong> to push them back.</p>
    <div>
      <button id="load">Load</button>
      <button id="save">Save</button>
      <button id="export">Export JSON</button>
    </div>
    <div style="margin-top:12px;">
      <textarea id="json" rows="18" placeholder='{"\/ty":"Thank you..."}'></textarea>
    </div>
    <script type="module" src="site.js"></script>
  </body>
</html>
