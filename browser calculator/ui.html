<div class="calc">
    <div class="calc-display">
      <div class="calc-expression"></div>
      <div class="calc-result">0</div>
    </div>
  
    <div class="calc-grid">
      <button>AC</button>
      <button>⌫</button>
      <button>%</button>
      <button class="op">÷</button>
  
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="op">×</button>
  
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="op">−</button>
  
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="op">+</button>
  
      <button class="span2">0</button>
      <button>.</button>
      <button class="equals">=</button>
    </div>
  </div>
  
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
  
    .calc {
      width: 280px;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  
    .calc-display {
      background: var(--panel);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  
    .calc-expression {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 18px;
      text-align: right;
    }
  
    .calc-result {
      font-size: 1.6rem;
      font-weight: 500;
      text-align: right;
    }
  
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
  
    button {
      background: #334155;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
  
    button:hover {
      background: #475569;
    }
  
    .op {
      background: #475569;
    }
  
    .equals {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }
  
    .equals:hover {
      background: #0ea5e9;
    }
  
    .span2 {
      grid-column: span 2;
    }
  </style>
