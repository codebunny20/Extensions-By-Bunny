<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunny Book</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <h1>Bunny Book</h1>
  <button id="newNote" title="New note">＋</button>
</header>

<div id="listView">
  <ul id="noteList"></ul>
</div>

<div id="editorView" class="hidden">
  <input id="titleInput" placeholder="Title">
  <textarea id="bodyInput" placeholder="Write here..."></textarea>

  <div class="editorButtons">
    <button id="saveNote">Save</button>
    <button id="deleteNote">Delete</button>
    <button id="exportNote">Export</button>
    <button id="backToList">Back</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
