<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunny Pad</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">Bunny Pad</h1>
    <button id="newNoteBtn" type="button">New</button>
  </header>

  <main>
    <div id="noteList"></div>

    <div id="editor" class="hidden">
      <input id="noteTitle" placeholder="Title" />
      <textarea id="noteContent"></textarea>

      <div class="row">
        <button id="saveBtn" type="button">Save</button>
        <button id="deleteBtn" type="button">Delete</button>
      </div>

      <div class="row">
        <button id="exportOneBtn" type="button">Export Note</button>
        <button id="backBtn" type="button">Back</button>
      </div>
    </div>
  </main>

  <footer>
    <button id="exportAllBtn" type="button">Export All</button>
    <span id="status" aria-live="polite"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
