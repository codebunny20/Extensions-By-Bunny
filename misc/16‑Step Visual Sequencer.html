<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Sequencer</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: #1a1a1a;
    color: #fff;
    font-family: sans-serif;
  }

  .sequencer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .group {
    padding: 12px;
    background: #222;
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .step input[type="range"] {
    writing-mode: bt-lr;
    appearance: slider-vertical;
    width: 24px;
    height: 120px;
  }

  .value {
    margin-top: 6px;
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>

<body>

<h2>16‑Step Sequencer</h2>

<div class="sequencer">
  <!-- 4 groups of 4 -->
  <div class="group">
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
  </div>

  <div class="group">
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
  </div>

  <div class="group">
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
  </div>

  <div class="group">
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
    <div class="step"><input type="range" min="-24" max="24" value="0"><div class="value">0</div></div>
  </div>
</div>

<script>
  document.querySelectorAll(".step input").forEach(slider => {
    slider.addEventListener("input", () => {
      slider.nextElementSibling.textContent = slider.value;
    });
  });
</script>

</body>
</html>
